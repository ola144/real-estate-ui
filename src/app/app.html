<div
  class="min-h-screen bg-[#f7f8fa] text-[#20242c] transition-colors duration-300 dark:bg-[#101214] dark:text-white"
>
  <ngx-sonner-toaster position="top-right" draggable="false" />
  <router-outlet />
</div>

<button
  type="button"
  (click)="onToggleTheme()"
  class="flex h-8 w-8 items-center justify-center rounded-full text-gray-500 dark:bg-gray-100 bg-[#22262a] fixed right-2 bottom-2 z-500"
>
  @if (!isDark) {
    <!-- Moon -->

    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path
        stroke-width="1.8"
        stroke-linecap="round"
        d="M21 12.8A8.5 8.5 0 1111.2 3 6.7 6.7 0 0021 12.8z"
      />
    </svg>
  } @else {
    <!-- Sun -->

    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <circle cx="12" cy="12" r="4" stroke-width="1.8" />

      <path
        stroke-width="1.8"
        stroke-linecap="round"
        d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"
      />
    </svg>
  }
</button>
