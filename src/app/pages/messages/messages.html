<div
  class="grid h-[calc(100vh-80px)] grid-cols-[320px_1fr] overflow-hidden rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-[#17191c] lg:ml-55 overflow-x-hidden"
>
  <!-- Chat list -->

  <app-chat-list
    [conversations]="conversations()"
    [currentUserId]="userId"
    (loadConversation)="loadConversations()"
    (conversationSelected)="selectConversation($event)"
  />

  <!-- Chat window -->

  <app-chat-window
    [conversation]="selectedConversation()"
    [currentUserId]="userId"
    (handleRealtimeMessage)="handleRealtimeMessage($event)"
    (videoCall)="startVideoCall($event)"
    (audioCall)="startAudioCall($event)"
  />

  @if (showCallScreen()) {
    <app-call-screen
      [user]="callUser()"
      [callType]="callType()"
      (close)="showCallScreen.set(false)"
    />
  }
</div>
