<!-- ========================================
         HEADER
    ========================================= -->

<header
  class="sticky top-0 left-0 z-500 border-b border-[#eceef1] bg-white/95 px-4 py-3 backdrop-blur sm:px-6 dark:border-[#202428] dark:bg-[#16191c]/95 lg:ml-55 h-fit"
>
  <div class="flex items-center justify-between max-w-7xl mx-auto w-full">
    <div class="flex items-center gap-3">
      <!-- Mobile menu -->

      <button
        type="button"
        class="rounded-lg p-2 text-gray-500 hover:bg-gray-100 lg:hidden dark:hover:bg-[#22262a]"
        (click)="onOpenSidebar()"
      >
        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-width="1.8" stroke-linecap="round" d="M4 6h16M4 12h16M4 18h16" />
        </svg>
      </button>

      <!-- Search -->

      <!-- <div
        class="h-9 w-67.5 items-center gap-2 rounded-md bg-[#f5f6f8] px-3 dark:bg-[#202428] sm:flex hidden"
      >
        <svg
          class="h-3.5 w-3.5 text-gray-400"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <circle cx="11" cy="11" r="7" stroke-width="1.8" />

          <path stroke-width="1.8" stroke-linecap="round" d="M20 20l-4-4" />
        </svg>

        <input
          type="text"
          placeholder="Search Property Customer etc"
          class="w-full bg-transparent text-[10px] outline-none placeholder:text-gray-400 dark:text-white"
        />
      </div> -->
    </div>

    <!-- Header right -->

    <div class="flex items-center gap-4">
      <!-- Notification -->

      <!-- <button type="button" class="relative text-gray-500">
        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path
            stroke-width="1.8"
            stroke-linecap="round"
            d="M18 8a6 6 0 00-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"
          />
        </svg>

        <span class="absolute -right-1 -top-1 h-1.5 w-1.5 rounded-full bg-red-500"></span>
      </button> -->

      <!-- User -->

      <div class="flex items-center gap-2">
        @if (user()?.photo) {
          <img
            [src]="user()?.photo"
            [alt]="user()?.name"
            class="h-8 w-8 rounded-full object-cover"
          />
        } @else {
          <div
            class="size-10 bg-emerald-400 text-shadow-white rounded-full p-1 items-center flex justify-center text-white font-semibold text-sm uppercase"
          >
            {{ user()?.name?.split(' ')?.[0]?.[0] }}{{ user()?.name?.split(' ')?.[1]?.[0] }}
          </div>
        }

        <div class="hidden sm:block">
          <p class="text-[11px] font-semibold">{{ user()?.name }}</p>

          <p class="text-[9px] text-gray-400">{{ user()?.email }}</p>
        </div>
      </div>
      <button
        class="bg-red-500 text-white rounded-lg p-1 hover:bg-red-400"
        aria-label="logout"
        (click)="showLogoutPopup.set(true)"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          fill="currentColor"
          viewBox="0 0 256 256"
        >
          <path
            d="M120,216a8,8,0,0,1-8,8H48a8,8,0,0,1-8-8V40a8,8,0,0,1,8-8h64a8,8,0,0,1,0,16H56V208h56A8,8,0,0,1,120,216Zm109.66-93.66-40-40A8,8,0,0,0,176,88v32H112a8,8,0,0,0,0,16h64v32a8,8,0,0,0,13.66,5.66l40-40A8,8,0,0,0,229.66,122.34Z"
          ></path>
        </svg>
      </button>
    </div>
  </div>
</header>

<app-logout [showLogoutPopup]="showLogoutPopup()" (closeLogoutPopup)="showLogoutPopup.set(false)" />
