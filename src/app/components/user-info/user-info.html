<aside
  class="hidden w-57.5 shrink-0 border-l border-gray-200 bg-white p-4 xl:block dark:border-gray-800 dark:bg-[#181c20]"
>
  <div class="flex flex-col items-center">
    <img
      [src]="selectedChat?.avatar"
      [alt]="selectedChat?.name"
      class="h-16 w-16 rounded-full object-cover"
    />

    <h3 class="mt-3 text-xs font-semibold text-gray-900 dark:text-white">
      {{ selectedChat?.name }}
    </h3>

    <p class="mt-1 text-[9px] text-gray-400">Customer</p>
  </div>

  <div class="mt-6 space-y-4 border-t border-gray-100 pt-5 dark:border-gray-800">
    <div>
      <p class="text-[8px] text-gray-400">Location</p>

      <p class="mt-1 text-[10px] text-gray-700 dark:text-gray-300">North Carolina, USA</p>
    </div>

    <div>
      <p class="text-[8px] text-gray-400">Email</p>

      <p class="mt-1 truncate text-[10px] text-gray-700 dark:text-gray-300">
        jane.cooper@example.com
      </p>
    </div>

    <div>
      <p class="text-[8px] text-gray-400">Phone</p>

      <p class="mt-1 text-[10px] text-gray-700 dark:text-gray-300">+1 234 567 890</p>
    </div>
  </div>
</aside>
