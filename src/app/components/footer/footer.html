<footer class="bg-[#202e28] px-5 py-14 text-white lg:px-8">
  <div class="mx-auto grid max-w-7xl gap-12 md:grid-cols-[1.4fr_1fr_1fr_1fr]">
    <div>
      <div>
        <a routerLink="/" class="inline-flex items-center gap-2">
          <div
            class="flex h-9 w-9 items-center justify-center rounded-lg bg-[#fefffa] text-[#202e28]"
          >
            <span class="text-lg font-bold">R</span>
          </div>

          <span class="text-lg font-bold text-gray-900 dark:text-white"> RealEstate </span>
        </a>
      </div>
      <p class="mt-5 max-w-xs text-sm leading-6 text-white/60">
        A more considered way to find the place that feels like home.
      </p>
    </div>
    <div>
      <p class="mb-4 text-xs font-bold uppercase tracking-[0.18em] text-[#d7ef61]">Explore</p>
      <a routerLink="/properties" class="block text-sm text-white/70 hover:text-white"
        >Properties</a
      >
    </div>
    <div>
      <p class="mb-4 text-xs font-bold uppercase tracking-[0.18em] text-[#d7ef61]">Company</p>
      <a routerLink="/about" class="block text-sm text-white/70 hover:text-white">Our story</a
      ><a routerLink="/contact" class="mt-3 block text-sm text-white/70 hover:text-white"
        >Get in touch</a
      >
      @if (authService.isAuthenticated()) {
        <a routerLink="/profile" class="mt-3 block text-sm text-white/70 hover:text-white"
          >My profile</a
        ><a routerLink="/my-bookings" class="mt-3 block text-sm text-white/70 hover:text-white"
          >My bookings</a
        >
      }
    </div>
    <div>
      <p class="mb-4 text-xs font-bold uppercase tracking-[0.18em] text-[#d7ef61]">Legal</p>
      <a routerLink="/terms" class="block text-sm text-white/70 hover:text-white"
        >Terms & conditions</a
      ><a routerLink="/privacy" class="mt-3 block text-sm text-white/70 hover:text-white"
        >Privacy policy</a
      >
    </div>
  </div>
  <div class="mx-auto mt-14 max-w-7xl border-t border-white/10 pt-5 text-xs text-white/40">
    © {{ year }} real estate. All rights reserved.
  </div>
</footer>
