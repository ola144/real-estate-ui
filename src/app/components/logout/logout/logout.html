@if (showLogoutPopup()) {
  <div
    class="bg-black/50 w-full h-full overflow-hidden fixed inset-0 flex items-center justify-center z-5000 sm:px-0 px-5 transition-all duration-300 opacity-0"
    [class]="showLogoutPopup() ? 'opacity-100' : ''"
  >
    <div class="w-full max-w-md rounded-2xl bg-white p-6 shadow-2xl dark:bg-[#181c20]">
      <h2 class="text-xl font-semibold dark:text-white text-gray-600">Log out?</h2>
      <p class="mt-2 text-sm leading-6 text-gray-500 dark:text-white">
        You're about to log out of your account. You can sign back in anytime.
      </p>
      <div class="flex justify-end gap-1">
        <button
          class="bg-gray-500 text-white rounded-xl py-2 px-4 text-sm hover:bg-gray-400 transition-all duration-300 disabled:cursor-no-drop"
          (click)="closeLogoutPopup.emit()"
          [disabled]="loading()"
        >
          Cancel
        </button>
        <button
          class="bg-red-500 text-white rounded-xl py-2 px-4 text-sm hover:bg-red-400 transition-all duration-300 disabled:cursor-no-drop"
          (click)="logout()"
          [disabled]="loading()"
        >
          {{ loading() ? 'Logging out...' : 'Logout' }}
        </button>
      </div>
    </div>
  </div>
}
