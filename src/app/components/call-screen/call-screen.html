@if (callType(); as type) {
  <div
    class="fixed inset-0 z-500 flex items-center justify-center bg-black/80 p-4 backdrop-blur-sm"
  >
    <!-- ================================================= -->
    <!-- VIDEO CALL -->
    <!-- ================================================= -->

    @if (type === 'video') {
      <div
        class="relative h-full max-h-175 w-full max-w-250 overflow-hidden rounded-2xl bg-[#15181b] shadow-2xl"
      >
        <!-- ============================================== -->
        <!-- REMOTE VIDEO -->
        <!-- ============================================== -->

        <video #remoteVideo autoplay playsinline class="h-full w-full object-cover"></video>

        <!-- ============================================== -->
        <!-- FALLBACK WHEN REMOTE VIDEO IS NOT AVAILABLE -->
        <!-- ============================================== -->

        <div class="absolute inset-0 z-0 flex items-center justify-center bg-[#15181b]">
          <div class="text-center">
            <img
              [src]="user()?.avatar"
              [alt]="user()?.name"
              class="mx-auto h-28 w-28 rounded-full object-cover"
            />

            <h2 class="mt-4 text-lg font-semibold text-white">
              {{ user()?.name }}
            </h2>

            <p class="mt-1 text-xs text-white/50">Video Call</p>
          </div>
        </div>

        <!-- ============================================== -->
        <!-- GRADIENT -->
        <!-- ============================================== -->

        <div
          class="pointer-events-none absolute inset-0 bg-linear-to-b from-black/50 via-transparent to-black/70"
        ></div>

        <!-- ============================================== -->
        <!-- TOP BAR -->
        <!-- ============================================== -->

        <div class="absolute left-0 right-0 top-0 flex items-center justify-between p-5">
          <div>
            <h2 class="text-sm font-semibold text-white">
              {{ user()?.name }}
            </h2>

            <p class="mt-1 text-[10px] text-white/60">Video Call</p>
          </div>

          <span class="rounded-full bg-black/30 px-3 py-1.5 text-[9px] text-white backdrop-blur">
            {{ duration() }}
          </span>
        </div>

        <!-- ============================================== -->
        <!-- LOCAL VIDEO -->
        <!-- ============================================== -->

        <div
          class="absolute right-5 top-5 mt-16 h-32 w-24 overflow-hidden rounded-xl border border-white/20 bg-gray-900 shadow-lg"
        >
          @if (isCameraOff()) {
            <div class="flex h-full items-center justify-center bg-[#252a2f]">
              <span
                class="flex h-10 w-10 items-center justify-center rounded-full bg-[#4f5bea] text-xs font-semibold text-white"
              >
                ME
              </span>
            </div>
          } @else {
            <video
              #localVideo
              autoplay
              muted
              playsinline
              class="h-full w-full object-cover"
            ></video>
          }
        </div>

        <!-- ============================================== -->
        <!-- CONTROLS -->
        <!-- ============================================== -->

        <div class="absolute bottom-7 left-1/2 flex -translate-x-1/2 items-center gap-3">
          <!-- MUTE -->

          <button
            type="button"
            (click)="toggleMute()"
            class="flex h-11 w-11 items-center justify-center rounded-full bg-white/15 text-white backdrop-blur transition hover:bg-white/25"
            [class.bg-white]="isMuted()"
            [class.text-gray-900]="isMuted()"
          >
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                d="M12 18a5 5 0 005-5V8a5 5 0 00-10 0v5a5 5 0 005 5Zm0 0v3m-4 0h8M19 13a7 7 0 01-14 0"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </button>

          <!-- CAMERA -->

          <button
            type="button"
            (click)="toggleCamera()"
            class="flex h-11 w-11 items-center justify-center rounded-full bg-white/15 text-white backdrop-blur transition hover:bg-white/25"
            [class.bg-white]="isCameraOff()"
            [class.text-gray-900]="isCameraOff()"
          >
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                d="m15 10 4.55-2.27A1 1 0 0121 8.62v6.76a1 1 0 01-1.45.89L15 14M5 18h8a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2Z"
                stroke-width="1.5"
              />
            </svg>
          </button>

          <!-- END -->

          <button
            type="button"
            (click)="closeCallScreen()"
            class="flex h-12 w-12 items-center justify-center rounded-full bg-red-500 text-white shadow-lg transition hover:bg-red-600"
          >
            <svg class="h-5 w-5 rotate-135" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.12.9.33 1.78.62 2.63a2 2 0 01-.45 2.11L8 9.73a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0122 16.92Z"
                stroke-width="1.5"
              />
            </svg>
          </button>

          <!-- SPEAKER -->

          <button
            type="button"
            (click)="toggleSpeaker()"
            class="flex h-11 w-11 items-center justify-center rounded-full bg-white/15 text-white backdrop-blur transition hover:bg-white/25"
          >
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                d="M11 5 6 9H3v6h3l5 4V5Zm4 3a5 5 0 010 8"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
          </button>
        </div>
      </div>
    }

    <!-- ================================================= -->
    <!-- VOICE CALL -->
    <!-- ================================================= -->

    @if (type === 'audio') {
      <div
        class="flex w-full max-w-105 flex-col items-center rounded-2xl bg-white px-8 py-12 shadow-2xl dark:bg-[#181c20]"
      >
        <!-- Avatar -->

        <div class="relative">
          <div class="absolute -inset-3 animate-pulse rounded-full bg-[#4f5bea]/10"></div>

          <img
            [src]="user()?.avatar"
            [alt]="user()?.name"
            class="relative h-24 w-24 rounded-full object-cover ring-4 ring-[#4f5bea]/20"
          />

          <span
            class="absolute bottom-1 right-1 h-4 w-4 rounded-full border-2 border-white bg-green-500 dark:border-[#181c20]"
          ></span>
        </div>

        <!-- Name -->

        <h2 class="mt-6 text-base font-semibold text-gray-900 dark:text-white">
          {{ user()?.name }}
        </h2>

        <p class="mt-1 text-xs text-gray-400">Voice Call</p>

        <!-- Duration -->

        <p class="mt-3 text-sm font-medium text-[#4f5bea]">
          {{ duration() }}
        </p>

        <!-- Controls -->

        <div class="mt-10 flex items-center gap-4">
          <!-- SPEAKER -->

          <button
            type="button"
            (click)="toggleSpeaker()"
            class="flex h-12 w-12 items-center justify-center rounded-full bg-gray-100 text-gray-600 transition hover:bg-gray-200 dark:bg-gray-800 dark:text-gray-300"
          >
            🔊
          </button>

          <!-- MUTE -->

          <button
            type="button"
            (click)="toggleMute()"
            class="flex h-12 w-12 items-center justify-center rounded-full bg-gray-100 text-gray-600 transition hover:bg-gray-200 dark:bg-gray-800 dark:text-gray-300"
            [class.bg-[#4f5bea]]="isMuted()"
            [class.text-white]="isMuted()"
          >
            🎙️
          </button>

          <!-- END -->

          <button
            type="button"
            (click)="closeCallScreen()"
            class="flex h-14 w-14 items-center justify-center rounded-full bg-red-500 text-white shadow-lg transition hover:bg-red-600"
          >
            <svg class="h-5 w-5 rotate-135" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path
                d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.12 4.18 2 2 0 014.11 2h3a2 2 0 012 1.72c.12.9.33 1.78.62 2.63a2 2 0 01-.45 2.11L8 9.73a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.85.29 1.73.5 2.63.62A2 2 0 0122 16.92Z"
                stroke-width="1.5"
              />
            </svg>
          </button>
        </div>
      </div>
    }
  </div>
}
